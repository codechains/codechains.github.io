name: Build & Deploy blog

on:
  push:
    branches: [main]
    # 쓰레드 원고는 사이트 산출물에 들어가지 않습니다.
    # 발행 자동화가 posted 표시를 커밋할 때마다 사이트를 다시 배포할 이유가 없습니다.
    paths-ignore:
      - "content/threads/**"
      - "design/**"
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # CC_DEPLOY=1 은 로컬 전용 관리 페이지(/admin)를 산출물에서 빼라는 신호입니다.
      # Actions 가 항상 넣어주는 CI=true 로도 같은 판정이 되지만, 배포 의도를 파일에 남겨둡니다.
      - run: node scripts/build.js
        env:
          CC_DEPLOY: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
