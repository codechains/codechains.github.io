name: 쓰레드 발행

# 10분마다 큐를 확인합니다. 다음 편의 예약 시각이 25분 안쪽이면 그 회차가 그 편을 맡고,
# 남은 시간은 스크립트 안에서 기다렸다가 예약 시각에 정확히 올립니다.
#
# 회차가 도는 시각에 바로 올리지 않는 이유는, 깃허브의 예약 실행이 시각을 안 지키기 때문입니다.
# 10분마다 돌라고 적어도 실제 시작은 몇 분에서 몇십 분씩 밀립니다. 그대로 올리면
# 관리 화면에 08:58 이라고 적힌 글이 09:11 에 올라갑니다. 시각을 흩어 놓은 뜻이 사라집니다.
#
# 10분 간격에 25분 여유를 둔 것은, 한 회차가 통째로 밀리거나 건너뛰어도
# 그다음 회차가 여전히 예약 시각 앞에서 잡히도록 겹쳐 두기 위해서입니다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 수동으로도 돌려볼 수 있습니다

# posted 표시를 저장소에 다시 적어야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 여러 실행이 겹치면 같은 편을 두 번 올릴 수 있습니다.
concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    # 준비가 끝나기 전에는 아예 돌지 않습니다.
    # 저장소 변수 THREADS_ENABLED 를 1 로 두어야 켜집니다.
    # 이게 없으면 15분마다 실패 알림만 쌓입니다(실제로 그렇게 됐습니다).
    #
    # 스위치가 둘인 이유
    #   THREADS_ENABLED=1  자동화를 켭니다. 이것만 있으면 무엇을 올릴지 로그로만 보여줍니다.
    #   THREADS_LIVE=1     실제로 올립니다. 며칠 로그를 보고 시각이 맞는지 확인한 뒤에 넣으세요.
    # 쓰레드는 올린 뒤 5분이 지나면 수정이 안 되고 삭제 후 재등록뿐이라, 단계를 나눠 둡니다.
    if: ${{ vars.THREADS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    # 예약 시각까지 최대 25분을 기다립니다. 거기에 준비와 발행 시간을 더해 넉넉히 잡습니다.
    # 무언가 걸려서 안 끝나는 경우에도 이 시간이면 끊깁니다.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 원고를 읽는 데 front-matter 가 필요합니다. 이게 없으면 스크립트가 첫 줄에서 죽습니다.
      - run: npm ci

      - name: 큐 확인 후 발행
        env:
          THREADS_LIVE: ${{ vars.THREADS_LIVE }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 발행 알림(왓츠앱). 넣지 않으면 알림만 건너뛰고 발행은 그대로 됩니다.
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ vars.WA_TEMPLATE }}
          WA_LANG: ${{ vars.WA_LANG }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
        run: node scripts/threads-publish.js

      - name: 발행 표시 커밋
        run: |
          if [ -z "$(git status --porcelain content/threads)" ]; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/threads
          git commit -m "쓰레드 발행 표시 [skip ci]"
          # 사람이 그사이 커밋했을 수 있으므로 한 번 당겨서 얹습니다.
          git pull --rebase origin main
          git push origin HEAD:main
